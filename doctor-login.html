<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

import { 
  getFirestore, 
  doc, 
  getDoc 
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

// 🔥 Your Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAnhR2-KIlypbb4hriWuqFRC3SRk9Zmi2Q",
  authDomain: "immunisphere-f6239.firebaseapp.com",
  projectId: "immunisphere-f6239",
  storageBucket: "immunisphere-f6239.firebasestorage.app",
  messagingSenderId: "141342230101",
  appId: "1:141342230101:web:f9ba568327657e643536dc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginBtn = document.getElementById("loginBtn");
const errorMsg = document.getElementById("errorMsg");

// 🔄 Auto-redirect if already logged in
onAuthStateChanged(auth, async (user) => {
  if (user) {
    const docSnap = await getDoc(doc(db, "users", user.uid));
    if (docSnap.exists() && docSnap.data().role === "doctor") {
      window.location.href = "doctor-dashboard.html";
    }
  }
});

// 🔐 Login function
loginBtn.addEventListener("click", async () => {
  errorMsg.textContent = "";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    errorMsg.textContent = "Please enter email and password.";
    return;
  }

  // ⏳ Disable button during login
  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    const docSnap = await getDoc(doc(db, "users", user.uid));

    if (!docSnap.exists()) {
      throw new Error("User profile not found.");
    }

    if (docSnap.data().role !== "doctor") {
      throw new Error("Access denied. Not a doctor account.");
    }

    // ✅ Save session info (optional)
    localStorage.setItem("doctorLoggedIn", "true");

    // 🚀 Redirect
    window.location.href = "doctor-dashboard.html";

  } catch (error) {
    console.error(error);

    // 🎯 Friendly errors
    if (error.code === "auth/user-not-found") {
      errorMsg.textContent = "No account found.";
    } else if (error.code === "auth/wrong-password") {
      errorMsg.textContent = "Incorrect password.";
    } else if (error.code === "auth/invalid-email") {
      errorMsg.textContent = "Invalid email format.";
    } else {
      errorMsg.textContent = error.message;
    }

  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }
});
</script>
