<!DOCTYPE html>
<html>
<head>
  <title>Doctor Login - Immunisphere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #2c3e50, #4ca1af);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 350px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #2c3e50;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2c3e50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #1a252f;
    }

    .error {
      color: red;
      margin-top: 10px;
      font-size: 14px;
    }

    .loader {
      display: none;
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="login-box">
  <h2>Doctor Login</h2>

  <input type="email" id="email" placeholder="Enter Email" />
  <input type="password" id="password" placeholder="Enter Password" />

  <button id="loginBtn">Login</button>

  <div class="loader" id="loader">Logging in...</div>
  <div class="error" id="errorMsg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

import { 
  getFirestore, 
  doc, 
  getDoc 
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

// 🔥 Your Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAnhR2-KIlypbb4hriWuqFRC3SRk9Zmi2Q",
  authDomain: "immunisphere-f6239.firebaseapp.com",
  projectId: "immunisphere-f6239",
  storageBucket: "immunisphere-f6239.firebasestorage.app",
  messagingSenderId: "141342230101",
  appId: "1:141342230101:web:f9ba568327657e643536dc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginBtn = document.getElementById("loginBtn");
const errorMsg = document.getElementById("errorMsg");
const loader = document.getElementById("loader");

// 🔄 Auto redirect if already logged in
onAuthStateChanged(auth, async (user) => {
  if (user) {
    const docSnap = await getDoc(doc(db, "users", user.uid));

    if (docSnap.exists() && docSnap.data().role === "doctor") {
      window.location.href = "doctor-dashboard.html";
    }
  }
});

// 🔐 Login
loginBtn.addEventListener("click", async () => {

  errorMsg.textContent = "";
  loader.style.display = "block";
  loginBtn.disabled = true;

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    errorMsg.textContent = "Please enter email and password.";
    loader.style.display = "none";
    loginBtn.disabled = false;
    return;
  }

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    // 🔍 Check role
    const docSnap = await getDoc(doc(db, "users", user.uid));

    if (!docSnap.exists()) {
      throw new Error("User profile not found.");
    }

    if (docSnap.data().role !== "doctor") {
      throw new Error("Access denied. Not a doctor account.");
    }

    // ✅ Success
    window.location.href = "doctor-dashboard.html";

  } catch (error) {
    console.error(error);

    if (error.code === "auth/user-not-found") {
      errorMsg.textContent = "No account found.";
    } else if (error.code === "auth/wrong-password") {
      errorMsg.textContent = "Incorrect password.";
    } else if (error.code === "auth/invalid-email") {
      errorMsg.textContent = "Invalid email.";
    } else {
      errorMsg.textContent = error.message;
    }

  } finally {
    loader.style.display = "none";
    loginBtn.disabled = false;
  }

});
</script>

</body>
</html>
